<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول المناوبات - عقاب رزوق</title>
    
    <!-- إعدادات تطبيق PWA للجوال -->
    <meta name="theme-color" content="#0078d4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="المناوبات">
    
    <!-- Manifest لتحديد أيقونة واسم التطبيق عند التثبيت -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"تقويم المناوبات - عقاب رزوق","short_name":"المناوبات","start_url":".","display":"standalone","background_color":"#f3f2f1","theme_color":"#0078d4","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3652/3652191.png","sizes":"512x512","type":"image/png"}]}'>

    <style>
        :root {
            --primary-color: #0078d4;
            --work-color: #d13438;
            --work-bg: #fde8e8;
            --off-color: #107c41;
            --off-bg: #e6f4ea;
            --bg-color: #f3f2f1;
            --card-bg: #ffffff;
            --text-color: #323130;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px;
            direction: rtl;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        /* ترويسة معلومات صاحب التطبيق */
        .user-header {
            background: linear-gradient(135deg, #0078d4, #005a9e);
            color: white;
            text-align: center;
            padding: 18px 12px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,120,212,0.25);
        }

        .user-header h1 {
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .user-header p {
            font-size: 0.95rem;
            opacity: 0.9;
            direction: ltr; /* لعرض رقم الهاتف بالشكل الصحيح */
            display: inline-block;
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .check-box {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        input[type="date"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            background: #fff;
        }

        button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }

        .result-badge {
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            display: none;
        }

        .result-work {
            background-color: var(--work-bg);
            color: var(--work-color);
            border: 1px solid var(--work-color);
        }

        .result-off {
            background-color: var(--off-bg);
            color: var(--off-color);
            border: 1px solid var(--off-color);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .month-title {
            text-align: center;
        }

        .month-title .gregorian {
            font-weight: bold;
            font-size: 1.05rem;
        }

        .month-title .hijri {
            font-size: 0.85rem;
            color: #605e5c;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .day-label {
            font-weight: bold;
            font-size: 0.8rem;
            padding: 6px 0;
            color: #605e5c;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 0.9rem;
            background: #faf9f8;
        }

        .day-cell.today {
            border: 2px solid var(--primary-color);
        }

        .day-cell.work {
            background-color: var(--work-bg);
            color: var(--work-color);
            font-weight: bold;
        }

        .day-cell.off {
            background-color: #fff;
            color: #323130;
        }

        .day-cell .hijri-num {
            font-size: 0.65rem;
            opacity: 0.75;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: #605e5c;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 10px;
            font-size: 0.85rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        #installBanner {
            display: none;
            background: #e1dfdd;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- شريط تثبيت التطبيق -->
    <div id="installBanner">
        <span>يمكنك تثبيت التطبيق على الشاشة الرئيسية!</span>
        <button onclick="installPWA()" style="margin-right: 8px; padding: 4px 12px;">تثبيت</button>
    </div>

    <!-- ترويسة اسم الصفحة وصاحب التطبيق -->
    <div class="user-header">
        <h1>جدول المناوبات</h1>
        <p>عقاب رزوق | 📱 0967791956</p>
    </div>

    <!-- فحص يوم محدد -->
    <div class="card">
        <h2>فحص يوم محدد</h2>
        <div class="check-box">
            <input type="date" id="checkDateInput">
            <button onclick="checkSpecificDate()">فحص</button>
        </div>
        <div id="checkResult" class="result-badge"></div>
    </div>

    <!-- التقويم -->
    <div class="card">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">&#10095;</button>
            <div class="month-title">
                <div class="gregorian" id="monthGregorian">--</div>
                <div class="hijri" id="monthHijri">--</div>
            </div>
            <button onclick="changeMonth(1)">&#10094;</button>
        </div>

        <div class="calendar-grid">
            <div class="day-label">أحد</div>
            <div class="day-label">إثنين</div>
            <div class="day-label">ثلاثاء</div>
            <div class="day-label">أربعاء</div>
            <div class="day-label">خميس</div>
            <div class="day-label">جمعة</div>
            <div class="day-label">سبت</div>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>

        <div class="legend">
            <div class="legend-item">
                <div class="color-dot" style="background: var(--work-color);"></div>
                <span>دوام</span>
            </div>
            <div class="legend-item">
                <div class="color-dot" style="background: #ccc;"></div>
                <span>عطلة</span>
            </div>
        </div>
    </div>

    <!-- الإعدادات -->
    <div class="card">
        <h2>إعدادات المناوبة</h2>
        <div class="settings-grid">
            <div class="form-group" style="grid-column: span 2;">
                <label>تاريخ يوم دوام مرجعي:</label>
                <input type="date" id="refDate" onchange="saveAndRender()">
            </div>
            <div class="form-group">
                <label>أيام الدوام:</label>
                <input type="number" id="workDays" value="1" min="1" onchange="saveAndRender()">
            </div>
            <div class="form-group">
                <label>أيام العطلة:</label>
                <input type="number" id="offDays" value="4" min="1" onchange="saveAndRender()">
            </div>
        </div>
    </div>

</div>

<script>
    let currentDate = new Date();
    let deferredPrompt;

    function getSettings() {
        return {
            refDate: localStorage.getItem('shift_ref_date') || new Date().toISOString().split('T')[0],
            workDays: parseInt(localStorage.getItem('shift_work_days')) || 1,
            offDays: parseInt(localStorage.getItem('shift_off_days')) || 4
        };
    }

    function initSettingsUI() {
        const settings = getSettings();
        document.getElementById('refDate').value = settings.refDate;
        document.getElementById('workDays').value = settings.workDays;
        document.getElementById('offDays').value = settings.offDays;
        document.getElementById('checkDateInput').value = new Date().toISOString().split('T')[0];
    }

    function saveAndRender() {
        localStorage.setItem('shift_ref_date', document.getElementById('refDate').value);
        localStorage.setItem('shift_work_days', document.getElementById('workDays').value);
        localStorage.setItem('shift_off_days', document.getElementById('offDays').value);
        renderCalendar();
    }

    function isWorkDay(targetDate) {
        const settings = getSettings();
        const ref = new Date(settings.refDate);
        ref.setHours(0,0,0,0);
        
        const target = new Date(targetDate);
        target.setHours(0,0,0,0);

        const cycleLength = settings.workDays + settings.offDays;
        const diffDays = Math.floor((target - ref) / (1000 * 3600 * 24));

        let dayInCycle = diffDays % cycleLength;
        if (dayInCycle < 0) dayInCycle += cycleLength;

        return dayInCycle < settings.workDays;
    }

    function checkSpecificDate() {
        const dateVal = document.getElementById('checkDateInput').value;
        if (!dateVal) return;

        const resultDiv = document.getElementById('checkResult');
        const isWork = isWorkDay(dateVal);
        const dateFormatted = new Date(dateVal).toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        resultDiv.style.display = 'block';
        if (isWork) {
            resultDiv.className = 'result-badge result-work';
            resultDiv.innerHTML = `تاريخ ${dateFormatted}:<br><b>يوم دوام (مناوبة) 🔴</b>`;
        } else {
            resultDiv.className = 'result-badge result-off';
            resultDiv.innerHTML = `تاريخ ${dateFormatted}:<br><b>يوم عطلة 🟢</b>`;
        }
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const monthNamesAr = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);

        const hijriFormatter = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-uma', { month: 'long', year: 'numeric' });
        
        document.getElementById('monthGregorian').innerText = `${monthNamesAr[month]} ${year}`;
        document.getElementById('monthHijri').innerText = `${hijriFormatter.format(firstDay)} - ${hijriFormatter.format(lastDay)}`;

        const startingDay = firstDay.getDay();
        for (let i = 0; i < startingDay; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day-cell';
            emptyCell.style.background = 'transparent';
            grid.appendChild(emptyCell);
        }

        const todayStr = new Date().toDateString();

        for (let day = 1; day <= lastDay.getDate(); day++) {
            const dateObj = new Date(year, month, day);
            const cell = document.createElement('div');
            cell.className = 'day-cell';

            if (dateObj.toDateString() === todayStr) cell.classList.add('today');

            const work = isWorkDay(dateObj);
            cell.classList.add(work ? 'work' : 'off');

            const hijriDayNum = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-uma', { day: 'numeric' }).format(dateObj);

            cell.innerHTML = `<span>${day}</span><span class="hijri-num">${hijriDayNum}</span>`;
            grid.appendChild(cell);
        }
    }

    function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
    }

    window.onload = function() {
        initSettingsUI();
        renderCalendar();
    };

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('installBanner').style.display = 'block';
    });

    function installPWA() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
                document.getElementById('installBanner').style.display = 'none';
                deferredPrompt = null;
            });
        }
    }
</script>

</body>
</html>
